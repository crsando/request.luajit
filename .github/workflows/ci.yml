name: CI

on:
    push:
    pull_request:

jobs:
    test:
        strategy:
            fail-fast: false
            matrix:
                os:
                    - ubuntu-latest
                    - macos-latest
        runs-on: ${{ matrix.os }}
        steps:
            - uses: actions/checkout@v4

            - name: Install Linux dependencies
              if: runner.os == 'Linux'
              run: |
                  sudo apt-get update
                  sudo apt-get install -y \
                      cmake \
                      libcurl4-openssl-dev \
                      libluajit-5.1-dev \
                      libuv1-dev \
                      lua-luv \
                      luajit \
                      pkg-config

            - name: Install macOS dependencies
              if: runner.os == 'macOS'
              run: |
                  brew install cmake curl libuv luajit luarocks pkg-config
                  luarocks \
                      --lua-dir="$(brew --prefix luajit)" \
                      --lua-version=5.1 \
                      install luv
                  echo "$(brew --prefix luajit)/bin" >> "$GITHUB_PATH"
                  echo "LUA_PATH=$(luarocks path --lua-version=5.1 --lr-path)" >> "$GITHUB_ENV"
                  echo "LUA_CPATH=$(luarocks path --lua-version=5.1 --lr-cpath)" >> "$GITHUB_ENV"
                  echo "CMAKE_PREFIX_PATH=$(brew --prefix curl)" >> "$GITHUB_ENV"
                  echo "PKG_CONFIG_PATH=$(brew --prefix curl)/lib/pkgconfig" >> "$GITHUB_ENV"

            - name: Test
              run: tests/run.sh
